<header class="site-header">
  <div class="site-header__utility">
    <div class="container site-header__utility-inner">
      <p class="site-header__utility-item">Chào mừng đến Siêu Thị Sữa Thanh Hậu</p>
      <div class="site-header__utility-right">
        <a class="site-header__utility-item site-header__utility-link" href="./account-orders.html">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 10h18M8 4v6M16 4v6" stroke-linecap="round"></path></svg>
          Theo dõi đơn hàng
        </a>
        <a class="site-header__utility-item site-header__utility-link" data-store-email-link href="#">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span data-store-email>lienhe@thanhhau.vn</span>
        </a>
      </div>
    </div>
  </div>

  <div class="site-header__main">
    <div class="container site-header__main-inner">
      <button type="button" class="site-header__menu-toggle" data-menu-toggle aria-label="Mở menu danh mục" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <a class="site-header__logo" href="./index.html">
        <img src="./assets/img/logo.png" alt="Siêu Thị Sữa Thanh Hậu" width="48" height="48" />
        <span class="site-header__logo-text">Thanh Hậu</span>
      </a>

      <form class="site-header__search" action="./shop.html" method="get">
        <label class="sr-only" for="site-search-category">Danh mục</label>
        <select id="site-search-category" name="category" class="site-header__search-select" data-category-select>
          <option value="">Tất cả danh mục</option>
        </select>

        <span class="site-header__search-divider" aria-hidden="true"></span>

        <label class="sr-only" for="site-search-input">Tìm sản phẩm</label>
        <input
          id="site-search-input"
          type="search"
          name="search"
          class="site-header__search-input"
          placeholder="Tìm sữa, thực phẩm dinh dưỡng..."
          autocomplete="off"
        />
        <button type="submit" class="site-header__search-btn" aria-label="Tìm kiếm">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5" stroke-linecap="round"></path>
          </svg>
        </button>
      </form>

      <div class="site-header__actions">
        <a href="./login.html" class="site-header__icon-link" data-account-link>
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M4.5 20c1.4-3.6 4.5-5.5 7.5-5.5s6.1 1.9 7.5 5.5" stroke-linecap="round"></path>
          </svg>
          <span class="site-header__icon-label">Tài khoản</span>
        </a>
        <a href="./cart.html" class="site-header__icon-link">
          <span class="site-header__icon-wrap">
            <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="9" cy="21" r="1.2" fill="currentColor" stroke="none"></circle>
              <circle cx="18" cy="21" r="1.2" fill="currentColor" stroke="none"></circle>
              <path d="M2.5 3h2l2.2 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21.5 8H6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span class="site-header__badge" data-cart-count hidden>0</span>
          </span>
          <span class="site-header__icon-label">Giỏ hàng</span>
        </a>
      </div>
    </div>
  </div>

  <nav class="site-header__nav">
    <div class="container site-header__nav-inner">
      <ul class="main-nav">
        <li class="main-nav__item">
          <a class="main-nav__link" href="./index.html">Trang chủ</a>
        </li>
        <li class="main-nav__item main-nav__item--dropdown" data-category-nav-anchor>
          <span class="main-nav__link">Đang tải danh mục...</span>
        </li>
        <li class="main-nav__item">
          <a class="main-nav__link" href="./about.html">Giới thiệu</a>
        </li>
        <li class="main-nav__item main-nav__item--dropdown">
          <button type="button" class="main-nav__link" aria-expanded="false">
            Góc tư vấn
            <svg class="main-nav__caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <ul class="main-nav__dropdown">
            <li><a href="./blog.html">Tin tức &amp; dinh dưỡng</a></li>
            <li><a href="./faq.html">Câu hỏi thường gặp</a></li>
          </ul>
        </li>
        <li class="main-nav__item">
          <a class="main-nav__link" href="./contact.html">Liên hệ</a>
        </li>
      </ul>
      <p class="site-header__tagline">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a6 6 0 0 1 6 6c0 3-2 4.5-2 6.5V17H8v-2.5C8 12.5 6 11 6 8a6 6 0 0 1 6-6Z"></path><path d="M9.5 21h5M10 17.5h4" stroke-linecap="round"></path></svg>
        <span>Cam kết sữa chính hãng · Giao hàng toàn quốc</span>
      </p>
    </div>
  </nav>
</header>
