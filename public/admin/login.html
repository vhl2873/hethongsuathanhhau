<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập quản trị - Siêu Thị Sữa Thanh Hậu</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png" />
  <link rel="apple-touch-icon" href="../assets/img/logo.png" />
  <meta name="robots" content="noindex, nofollow" />

  <script src="../assets/js/env.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/pages/auth.css" />
</head>
<body>
  <main class="container page-section">
    <div class="auth-page">
      <div class="card auth-card">
        <h1 class="auth-card__title">Đăng nhập quản trị</h1>

        <div class="alert alert--danger" data-form-error hidden></div>

        <form data-admin-login-form novalidate>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label class="field__label" for="password">Mật khẩu</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn--primary auth-card__submit">Đăng nhập</button>
        </form>

        <p class="auth-card__footer"><a href="../index.html">&larr; Về trang bán hàng</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="../assets/js/admin/login.js"></script>
</body>
</html>
