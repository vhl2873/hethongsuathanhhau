<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký - Siêu thị sữa Thành Hậu</title>
  <meta name="description" content="Tạo tài khoản Siêu thị sữa Thành Hậu để mua sắm nhanh hơn và theo dõi đơn hàng." />

  <script src="./assets/js/env.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/pages/auth.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container page-section">
    <div class="auth-page">
      <div class="card auth-card">
        <h1 class="auth-card__title">Tạo tài khoản</h1>

        <div class="alert alert--danger" data-form-error hidden></div>
        <div class="alert alert--success" data-form-success hidden></div>

        <form data-register-form novalidate>
          <div class="field">
            <label class="field__label" for="fullName">Họ tên</label>
            <input class="input" type="text" id="fullName" name="fullName" required autocomplete="name" />
          </div>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label class="field__label" for="password">Mật khẩu</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="new-password" />
            <span class="field__hint">Ít nhất 6 ký tự.</span>
          </div>
          <div class="field">
            <label class="field__label" for="passwordConfirm">Xác nhận mật khẩu</label>
            <input class="input" type="password" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn--primary auth-card__submit">Đăng ký</button>
        </form>

        <p class="auth-divider">Hoặc</p>
        <div class="auth-social">
          <button type="button" class="auth-social__btn" data-oauth="google">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
            Đăng ký bằng Google
          </button>
          <button type="button" class="auth-social__btn" data-oauth="facebook">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#1877F2" d="M18 9a9 9 0 1 0-10.4 8.89v-6.29H5.31V9h2.29V7.02c0-2.26 1.34-3.5 3.4-3.5.99 0 2.02.17 2.02.17v2.22h-1.14c-1.12 0-1.47.7-1.47 1.42V9h2.5l-.4 2.6h-2.1v6.29A9 9 0 0 0 18 9Z"/></svg>
            Đăng ký bằng Facebook
          </button>
        </div>

        <p class="auth-card__footer">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="./assets/js/lib/include.js"></script>
  <script type="module" src="./assets/js/pages/register.js"></script>
</body>
</html>
